name: Publication security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tracked content for secrets and private artifacts
        run: python3 tools/check_public_files.py
      - name: Check Python and shell syntax
        run: |
          python3 -m compileall -q src tests tools
          bash -n install.sh uninstall.sh
      - name: Run security regression tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p test_security.py -v
