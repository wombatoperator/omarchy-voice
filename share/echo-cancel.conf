# PipeWire acoustic echo cancellation, for omarchy-voice on speakers.
#
# Only needed if you want `barge_in = true` — interrupting Oma mid-sentence —
# while her voice is coming out of speakers rather than headphones. Without
# either this or the default half-duplex gate, her own voice returns through
# the microphone, the server's turn detection treats it as you, and she answers
# herself.
#
# Install:
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp share/echo-cancel.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse
#
# Then point omarchy-voice at the cancelled source and allow barge-in:
#   # ~/.config/omarchy-voice/config.toml
#   [ears]
#   device = "echo-cancel-source"
#   barge_in = true
#
# `pactl list sources short | grep echo` confirms it appeared.

context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      # Leave these unset to follow whatever your defaults are; name them if
      # you have more than one interface and want to pin the pair.
      # capture.props  = { node.target = "alsa_input.usb-...-source" }
      # playback.props = { node.target = "alsa_output.usb-...-sink" }
      source.props = {
        node.name        = "echo-cancel-source"
        node.description = "Microphone (echo cancelled)"
      }
      sink.props = {
        node.name        = "echo-cancel-sink"
        node.description = "Speakers (echo cancelled)"
      }
      aec.args = {
        # WebRTC's canceller. Keep the analog gain control off: it fights a
        # hardware preamp such as the Scarlett's, and the two hunt each other.
        webrtc.gain_control              = true
        webrtc.analog_gain_control       = false
        webrtc.digital_gain_control      = true
        webrtc.noise_suppression         = true
        webrtc.high_pass_filter          = true
      }
    }
  }
]
